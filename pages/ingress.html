<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingress Architecture Explorer</title>
<style>
/* FlowKit: 3D architecture animation kit (CSS 3D, deterministic timeline) */
.fk-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #060B17;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #E2E8F0;
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
  contain: paint; }   /* clip the 3D layers to the scene for compositing too: their projected extent reached far below it and showed as a lighter band on the page */
.fk-frame.dragging { cursor: grabbing; }
/* fill the window: !important so it beats a page's own sizing of the frame (e.g. #fk { width: min(100%, 1280px) }) */
.fk-frame.fk-max { position: fixed !important; inset: 0 !important; width: auto !important; height: auto !important; max-width: none !important; max-height: none !important; margin: 0 !important; aspect-ratio: auto !important; z-index: 1000; border-radius: 0; box-shadow: none; background: #03060E; }
.fk-maxed, .fk-maxed body { overflow: hidden; }
.fk-scaler { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; }   /* clips labels to the 16:9 scene (letterboxed when filling the window); no clip-path: under preserve-3d Chrome computed a wrong clip for the 3D layers and dropped parts of the scene at some camera angles */
.fk-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 50%; overflow: hidden;
  background: radial-gradient(ellipse at 50% 20%, #13264A 0%, #0A1530 50%, #050A16 100%); }
.fk-world { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
.fk-n { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.fk-f { position: absolute; box-sizing: border-box; backface-visibility: hidden; }
.fk-f.two { backface-visibility: visible; }
.fk-bb { position: absolute; left: 0; top: 0; }
.fk-ov, .fk-hud { position: absolute; inset: 0; pointer-events: none; }
.fk-hud-i { pointer-events: auto; cursor: default; }
.fk-dip { position: absolute; inset: 0; background: #050A16; opacity: 0; pointer-events: none; }

/* Devices */
.fk-dev { --led: #34D399; --accent: #38BDF8; }
.fk-dev .fk-f { box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .28); }
.fk-dev .fk-glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--led), transparent); opacity: .35; }
.fk-ledstrip { position: absolute; width: 5px; background: repeating-linear-gradient(180deg, var(--led) 0 5px, transparent 5px 16px); }
.fk-slots { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(180deg, transparent 0 14px, rgba(148, 163, 184, .14) 14px 16px); }
.fk-n.err .fk-f.f-front, .fk-n.err .fk-f.f-top { background-color: #7F1D1D !important; }
.fk-dev.down .fk-f.f-front, .fk-dev.down .fk-f.f-top { background-color: #3B1220 !important; }
.fk-dimmed .fk-f { filter: brightness(.32) saturate(.4); }

/* Signposts */
.fk-signb { position: absolute; inset: 0; clip-path: polygon(0 0, 86% 0, 100% 50%, 86% 100%, 0 100%); background: color-mix(in srgb, var(--sc) 22%, #0B1220); transition: background-color .2s; }
.fk-signb.on { background: var(--sc); }
.fk-sign { height: 100%; display: flex; align-items: center; padding-left: 12px; font: 700 21px/1 system-ui, sans-serif; color: #E2E8F0; letter-spacing: .02em; white-space: nowrap; }
.fk-signb.on .fk-sign { color: #0B1220; }

/* Links */
.fk-link .fk-f { background: #2E5E96; transition: background-color .2s, box-shadow .2s; }
.fk-link.steer .fk-f { background: rgba(148, 163, 184, .25); }
.fk-link.pvt .fk-f { background: rgba(45, 212, 191, .45); box-shadow: 0 0 8px rgba(45, 212, 191, .35); }
.fk-link.lit .fk-f { background: #38BDF8; box-shadow: 0 0 12px #38BDF8; }
.fk-link.mtls .fk-f { background: #A78BFA; box-shadow: 0 0 12px #A78BFA; }
.fk-link.ok .fk-f { background: #34D399; box-shadow: 0 0 12px #34D399; }
.fk-link.bad .fk-f { background: #F43F5E; box-shadow: 0 0 12px #F43F5E; }
.fk-link.dns .fk-f { background: #F472B6; box-shadow: 0 0 12px #F472B6; }
.fk-link.priv .fk-f { background: #2DD4BF; box-shadow: 0 0 12px #2DD4BF; }
.fk-link.dead .fk-f { background: #3A2430; box-shadow: none; }
/* DNS pipe: one quiet connection between the clients and the DNS control plane (muted slate, static dashes) */
.fk-link.dnspipe .fk-f { }   /* static: no endless drift */
.fk-link.dnspipe .fk-f:first-child { background: repeating-linear-gradient(180deg, rgba(148, 163, 184, .38) 0 6px, rgba(148, 163, 184, .14) 6px 14px); background-size: 100% 14px; }
.fk-link.dnspipe .fk-f:last-child { background: repeating-linear-gradient(90deg, rgba(148, 163, 184, .38) 0 6px, rgba(148, 163, 184, .14) 6px 14px); background-size: 14px 100%; }
.fk-link.dnspipe.dns .fk-f { box-shadow: 0 0 8px rgba(203, 213, 225, .35); filter: brightness(1.5); }
/* DNS flow lines: small feeders (clients -> pipe -> NS / GTM / LB), static dashes */
.fk-link.dnsflow .fk-f { --ps: 16px; box-shadow: none; }   /* static: no endless drift */
.fk-link.dnsflow .fk-f:first-child { background: repeating-linear-gradient(180deg, rgba(148, 163, 184, .34) 0 30%, transparent 30% 100%); background-size: 100% var(--ps); }
.fk-link.dnsflow .fk-f:last-child { background: repeating-linear-gradient(90deg, rgba(148, 163, 184, .34) 0 30%, transparent 30% 100%); background-size: var(--ps) 100%; }
.fk-link.dnsflow.dns .fk-f { filter: brightness(1.8); box-shadow: 0 0 6px rgba(203, 213, 225, .3); }

/* Control-plane lines (DNS steering decisions): dashed, never carry traffic */
.fk-link.steer .fk-f:first-child { background: repeating-linear-gradient(180deg, rgba(148, 163, 184, .32) 0 4px, transparent 4px 10px); box-shadow: none; }
.fk-link.steer .fk-f:last-child { background: repeating-linear-gradient(90deg, rgba(148, 163, 184, .32) 0 4px, transparent 4px 10px); box-shadow: none; }
.fk-link.steer.dns .fk-f:first-child { background: repeating-linear-gradient(180deg, #CBD5E1 0 4px, transparent 4px 10px); }
.fk-link.steer.dns .fk-f:last-child { background: repeating-linear-gradient(90deg, #CBD5E1 0 4px, transparent 4px 10px); }

/* Zones */
.fk-zlabel { font: 700 44px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.fk-zlabel small { display: block; font-size: 22px; letter-spacing: .06em; font-weight: 500; margin-top: 8px; opacity: .8; text-transform: none; }

/* Screen-space labels */
.fk-label { transform: translate(-50%, -100%); white-space: nowrap; background: rgba(8, 15, 32, .86); border: 1px solid rgba(125, 211, 252, .35);
  border-radius: 7px; padding: 4px 9px; font-size: 12px; color: #E2E8F0; display: flex; align-items: center; gap: 7px; transition: border-color .3s, box-shadow .3s, opacity .3s; }
.fk-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--led, #34D399); box-shadow: 0 0 6px var(--led, #34D399); flex: none; }
.fk-label .ly { font: 700 9px/1 ui-monospace, Menlo, monospace; color: #0B1220; background: var(--lc); border-radius: 3px; padding: 2px 3px; }
.fk-label .sub { display: none; color: #7DD3FC; font-size: 11px; }
.fk-label.dev { pointer-events: auto; cursor: pointer; }
.fk-label.dev:hover, .fk-label.sel { border-color: #7DD3FC; }
.fk-label.dev:hover .sub, .fk-label.active .sub, .fk-label.sel .sub { display: inline; }
.fk-label.active { border-color: #7DD3FC; box-shadow: 0 0 18px rgba(56, 189, 248, .45); }
.fk-label.sel { box-shadow: 0 0 0 2px #7DD3FC, 0 0 18px rgba(56, 189, 248, .45); }
.fk-label.dim { opacity: .3; }
.fk-label.wall { font-size: 11px; color: #CBD5E1; }
.no-labels .fk-label:not(.active):not(.sel) { display: none; }

/* Packet */
.fk-core { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; }
.fk-chip { transform: translate(-50%, -100%); white-space: nowrap; background: rgba(8, 15, 32, .92); border-radius: 6px; padding: 4px 8px;
  font: 600 11px ui-monospace, Menlo, monospace; color: #E0F2FE; border: 1px solid var(--pc, #38BDF8); display: flex; align-items: center; gap: 6px; }
.fk-chip small { font: 500 10px system-ui, sans-serif; color: #94A3B8; }
.fk-chip.big { font: 700 46px system-ui, sans-serif; padding: 16px 30px; border-width: 4px; border-radius: 18px; color: #F8FAFC; box-shadow: 0 0 40px var(--pc), 0 0 0 8px rgba(8, 15, 32, .6); }   /* a message that must not be missed (world-sized: it is seen from far away) */

.fk-dot { border-radius: 50%; background: var(--c); box-shadow: 0 0 10px 2px var(--c); }

/* Drill-down: deployment view that slides out of a node */
.fk-dwrap { position: absolute; left: 0; top: 0; }
.fk-dwrap .lead line { stroke: rgba(125, 211, 252, .55); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fk-drill { position: relative; transform-origin: 0 100%; background: rgba(6, 12, 26, .97); border: 1px solid rgba(125, 211, 252, .5); border-radius: 12px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .6); font-size: 11px; color: #CBD5E1; }
.fk-drill .dh { position: absolute; left: 18px; top: 11px; right: 18px; display: flex; gap: 10px; align-items: baseline; }
.fk-drill .dh b { font-size: 14px; color: #F1F5F9; }
.fk-drill .dh span { color: #7DD3FC; font-size: 11px; }
.fk-drill .fr { position: absolute; left: 18px; top: 34px; right: 18px; font: 10px ui-monospace, Menlo, monospace; color: #64748B; border: 1px dashed rgba(100, 116, 139, .5); border-radius: 6px; padding: 3px 8px; }
.fk-drill .lnl { position: absolute; font: 600 10px ui-monospace, Menlo, monospace; color: #7DD3FC; letter-spacing: .04em; }
.fk-drill .box { position: absolute; border: 1px dashed rgba(52, 211, 153, .45); border-radius: 10px; background: rgba(16, 40, 32, .25); }
.fk-drill .box span { position: absolute; left: 9px; top: 7px; font: 600 10px ui-monospace, Menlo, monospace; color: #6EE7B7; letter-spacing: .03em; }
.fk-drill .st { position: absolute; box-sizing: border-box; border: 1px solid #1E293B; background: #0B1324; border-radius: 9px; padding: 7px 9px; transition: border-color .2s, box-shadow .2s, background-color .2s, opacity .2s; }
.fk-drill .st.active { border-color: #38BDF8; box-shadow: 0 0 16px rgba(56, 189, 248, .35); background: #0E2038; }
.fk-drill .st.done { border-color: rgba(52, 211, 153, .7); }
.fk-drill .st.fail { border-color: #F43F5E; box-shadow: 0 0 16px rgba(244, 63, 94, .35); background: #2A0E18; }
.fk-drill .st.skip { opacity: .42; border-style: dashed; }
.fk-drill .nm { font: 700 11.5px ui-monospace, Menlo, monospace; color: #E2E8F0; }
.fk-drill .sb { color: #7DD3FC; font-size: 9.5px; margin: 2px 0 4px; }
.fk-drill .ck { display: flex; gap: 6px; align-items: flex-start; line-height: 1.25; margin-top: 3px; opacity: .25; }
.fk-drill .ck.on { opacity: 1; }
.fk-drill .ck b { flex: none; width: 13px; height: 13px; border-radius: 50%; background: #1E293B; font-size: 8px; display: grid; place-items: center; margin-top: 1px; color: #0B1220; }
.fk-drill .ck.pass b { background: #34D399; } .fk-drill .ck.pass b::before { content: '\2713'; }
.fk-drill .ck.fail b { background: #F43F5E; color: #fff; } .fk-drill .ck.fail b::before { content: '\2715'; }
.fk-drill .ck.fail span { color: #FDA4AF; }
.fk-drill .ck.skip { opacity: .5; } .fk-drill .ck.skip b { background: #334155; color: #CBD5E1; } .fk-drill .ck.skip b::before { content: '\2013'; }
.fk-drill .note { margin-top: 5px; font-size: 9.5px; color: #94A3B8; font-style: italic; }
.fk-drill .st.fail .note { color: #FDA4AF; font-style: normal; font-weight: 600; }
.fk-drill .ar { position: absolute; height: 2px; background: #334155; }
.fk-drill .ar::after { content: ''; position: absolute; right: -1px; top: -3px; border: 4px solid transparent; border-left-color: #334155; border-right: 0; }
.fk-drill .tok { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #F8FAFC; box-shadow: 0 0 12px 3px #38BDF8; z-index: 3; }
.fk-drill .tok.bad { background: #FECDD3; box-shadow: 0 0 14px 4px #F43F5E; }
.fk-drill .tok.ok { box-shadow: 0 0 14px 4px #34D399; }
.fk-drill .tok.sig { background: #FBCFE8; box-shadow: 0 0 14px 4px #F472B6; }
.fk-drill .pl { position: absolute; box-sizing: border-box; border: 1px solid #1E293B; border-radius: 9px; background: #070D1A; padding: 7px 9px; overflow: hidden; }
.fk-drill .pl .ph { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 6px; font: 700 10px ui-monospace, Menlo, monospace; color: #E2E8F0; }
.fk-drill .pl .bd { font: 600 9px system-ui; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
.fk-drill .pl pre { margin: 5px 0 0; font: 9.5px/1.4 ui-monospace, Menlo, monospace; color: #A5B4FC; white-space: pre-wrap; }
.fk-drill .pl pre .inj { background: rgba(244, 63, 94, .3); color: #FECDD3; border-radius: 2px; }
.fk-drill .pl pre .flag { background: rgba(251, 191, 36, .28); color: #FDE68A; border-radius: 2px; }
.fk-drill .pl .rs { margin-top: 4px; font: 600 9.5px ui-monospace, Menlo, monospace; }

/* Policy evaluation panel (inside a drill) */
.fk-drill .ev { display: flex; flex-direction: column; height: 100%; gap: 6px; }
.fk-drill .ev .eh { display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: baseline; font: 700 10.5px ui-monospace, Menlo, monospace; color: #E2E8F0; }
.fk-drill .ev .eh small { font: 600 9px system-ui; padding: 1px 6px; border-radius: 8px; }
.fk-drill .ev .js { font: 9.5px/1.45 ui-monospace, Menlo, monospace; color: #A5B4FC; background: #050A14; border: 1px solid #172033; border-radius: 6px; padding: 4px 7px; }
.fk-drill .ev .js div { border-radius: 3px; padding: 0 3px; white-space: pre; }
.fk-drill .ev .js .scan { background: rgba(56, 189, 248, .22); color: #E0F2FE; box-shadow: inset 2px 0 0 #38BDF8; }
.fk-drill .ev .js .hit { background: rgba(244, 63, 94, .28); color: #FECDD3; box-shadow: inset 2px 0 0 #F43F5E; }
.fk-drill .ev .js .inj { background: rgba(244, 63, 94, .35); color: #FFE4E6; border-radius: 2px; }
.fk-drill .ev .js .flag { background: rgba(251, 191, 36, .3); color: #FEF3C7; border-radius: 2px; }
.fk-drill .ev .pk { font: 600 9.5px ui-monospace, Menlo, monospace; color: #67E8F9; }
.fk-drill .ev .pk.route { color: #86EFAC; }
.fk-drill .ev .pk span { color: #64748B; font-weight: 400; }
.fk-drill .ev .rl { display: grid; grid-template-columns: 14px 128px 1fr; gap: 6px; align-items: center; font: 9.5px ui-monospace, Menlo, monospace; color: #CBD5E1; line-height: 1.35; }
.fk-drill .ev .rl i { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; font: 700 8px system-ui; font-style: normal; color: #0B1220; background: #34D399; }
.fk-drill .ev .rl.x i { background: #F43F5E; color: #fff; }
.fk-drill .ev .rl.cur { color: #F1F5F9; }
.fk-drill .ev .rl.cur i { background: #38BDF8; }
.fk-drill .ev .rl em { font-style: normal; color: #94A3B8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fk-drill .ev .rl.x em { color: #FDA4AF; }
.fk-drill .ev .out { margin-top: auto; font: 600 9.5px/1.4 ui-monospace, Menlo, monospace; border-top: 1px solid #1E293B; padding-top: 5px; }
.fk-drill .ev .out.ok { color: #34D399; } .fk-drill .ev .out.no { color: #FB7185; }

/* Panels (checklists, payload) */
.fk-panel { position: absolute; min-width: 240px; max-width: 330px; background: rgba(8, 15, 32, .94); border: 1px solid rgba(125, 211, 252, .4); border-radius: 10px;
  padding: 10px 12px; font-size: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.fk-panel h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7DD3FC; }
.fk-panel .it { display: flex; gap: 8px; align-items: center; padding: 3px 0; opacity: .25; transition: opacity .2s; }
.fk-panel .it.on { opacity: 1; }
.fk-panel .it b { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; background: #1E293B; color: #0B1220; }
.fk-panel .it.on.pass b { background: #34D399; }
.fk-panel .it.on.fail b { background: #F43F5E; color: #fff; }
.fk-panel .it.on.warn b { background: #FBBF24; }
.fk-panel .it.on.skip b { background: #475569; color: #E2E8F0; }
.fk-panel .it.on.skip span { color: #94A3B8; }
.fk-panel .res { margin-top: 6px; padding-top: 6px; border-top: 1px solid #1E293B; font-weight: 600; opacity: 0; transition: opacity .2s; }
.fk-panel .res.on { opacity: 1; }
.fk-panel pre { margin: 0 0 6px; font: 11px/1.45 ui-monospace, Menlo, monospace; color: #CBD5E1; }
.fk-panel pre .hl { background: rgba(56, 189, 248, .18); }
.fk-panel pre .bad { background: rgba(244, 63, 94, .28); color: #FECDD3; }

/* HUD: caption, trace, legend, info card, free-camera pill */
.fk-caption { position: absolute; left: 50%; top: 0; width: 680px; margin-left: -340px; box-sizing: border-box; transform-origin: 50% 0; text-align: center;
  background: rgba(8, 15, 32, .84); border: 1px solid rgba(125, 211, 252, .28); padding: 11px 20px 13px; border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .35); z-index: 5; }
@keyframes fkCap { from { opacity: 0; transform: translateY(6px); } }
.fk-caption .st { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #7DD3FC; }
.fk-caption .tx { font-size: 16px; line-height: 1.38; margin-top: 5px; color: #E2E8F0; }   /* one line, about 12 words */
.fk-trace { position: absolute; right: 18px; top: 16px; width: 360px; background: rgba(8, 15, 32, .86); border: 1px solid rgba(167, 139, 250, .35);
  border-radius: 10px; padding: 10px 12px; font-size: 11px; }
.no-trace .fk-trace, .fk-notrace .fk-trace { display: none; }
.fk-presenting .fk-trace, .fk-presenting .fk-legend { opacity: 0; transition: opacity .3s; }
.fk-trace, .fk-legend { transition: opacity .3s; }
.fk-trace h4 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #C4B5FD; display: flex; justify-content: space-between; }
.fk-trace .tid { font: 10px ui-monospace, Menlo, monospace; color: #94A3B8; margin: 3px 0 6px; }
.fk-trace .row { display: grid; grid-template-columns: 128px 1fr 44px; gap: 6px; align-items: center; height: 17px; }
.fk-trace .row.nw { animation: fkRow .3s ease-out; }
@keyframes fkRow { from { opacity: 0; transform: translateX(12px); } }
.fk-trace .svc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #CBD5E1; }
.fk-trace .lane { position: relative; height: 8px; background: rgba(148, 163, 184, .08); border-radius: 3px; }
.fk-trace .bar { position: absolute; top: 0; height: 8px; border-radius: 3px; background: #A78BFA; }
.fk-trace .bar.err { background: #F43F5E; }
.fk-trace .bar.warn { background: #FBBF24; }
.fk-trace .ms { text-align: right; color: #94A3B8; font: 10px ui-monospace, Menlo, monospace; }
.fk-trace .ms.err { color: #FDA4AF; }

.fk-legend { position: absolute; left: 16px; top: 16px; width: 250px; background: rgba(8, 15, 32, .86); border: 1px solid rgba(148, 163, 184, .25);
  border-radius: 10px; padding: 8px 6px 6px; font-size: 12px; }
.no-legend .fk-legend { display: none; }
.fk-legend h4 { margin: 0 6px 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #94A3B8; }
.fk-legend .lr { display: grid; grid-template-columns: 26px 1fr auto; gap: 7px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; position: relative; }
.fk-legend .lr:hover { background: rgba(148, 163, 184, .1); }
.fk-legend .lr b { font: 700 10px/1 ui-monospace, Menlo, monospace; color: #0B1220; background: var(--lc); border-radius: 4px; padding: 3px 0; text-align: center; }
.fk-legend .lr span { color: #E2E8F0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fk-legend .lr small { color: #64748B; font-size: 10px; white-space: nowrap; }
.fk-legend .lr.on { background: rgba(125, 211, 252, .1); }
.fk-legend .lr.cur { background: rgba(56, 189, 248, .18); box-shadow: inset 2px 0 0 #38BDF8; }
.fk-legend .lr.cur::after { content: ''; position: absolute; right: -4px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #38BDF8; box-shadow: 0 0 8px #38BDF8; }

.fk-info { position: absolute; right: 18px; bottom: 18px; width: 320px; background: rgba(8, 15, 32, .95); border: 1px solid rgba(125, 211, 252, .45);

.fk-info .br { display: grid; grid-template-columns: 38px 1fr 44px; gap: 8px; align-items: center; height: 17px; color: #94A3B8; font-size: 11px; }

.fk-free { position: absolute; left: 0; bottom: 0; display: flex; align-items: center; gap: 8px; background: rgba(8, 15, 32, .9);
  border: 1px solid rgba(251, 191, 36, .5); border-radius: 20px; padding: 4px 6px 4px 12px; font-size: 12px; color: #FDE68A; }
.fk-free .fk-ic { padding: 3px 7px; display: inline-grid; place-items: center; }

.fk-sparkbar { flex: 1; background: #8B5CF6; border-radius: 4px 4px 0 0; height: 100%; transform: scaleY(.4); transform-origin: 50% 100%; animation: fkSpark 2.4s ease-in-out infinite alternate; }   /* scaled, not resized: no layout or repaint per frame */
@keyframes fkSpark { 0% { transform: scaleY(.18); } 50% { transform: scaleY(.72); } 100% { transform: scaleY(.35); } }
.fk-new { animation: fkRow .3s ease-out; }
.fk-blink { animation: fkBlink 1.2s linear; }

/* Latency budget HUD */
.fk-budget { position: absolute; right: 18px; bottom: 18px; width: 560px; background: rgba(8, 15, 32, .88); border: 1px solid rgba(148, 163, 184, .25); border-radius: 10px; padding: 8px 11px 7px; font-size: 11px; }

.fk-budget .tot b { color: #CBD5E1; font-size: 13px; font-weight: 400; } .fk-budget .tot b.over { color: #FB7185; }   /* neutral total: only going over the budget gets a colour */
.fk-budget .tot .k { margin-right: 10px; font-size: 10px; color: #94A3B8; }
.fk-budget .tot .k.net::before, .fk-budget .lg .net-key::before { content: ''; display: inline-block; width: 12px; height: 6px; margin-right: 4px; border-radius: 1px; vertical-align: middle;
  background: repeating-linear-gradient(135deg, #94A3B8 0 2px, transparent 2px 4px); }
.fk-budget .sg.net { background: repeating-linear-gradient(135deg, rgba(148, 163, 184, .24) 0 3px, rgba(148, 163, 184, .07) 3px 6px); }   /* network legs: chevrons even when empty */
.fk-budget .sg.net i { background: repeating-linear-gradient(135deg, var(--c) 0 3px, rgba(0, 0, 0, .35) 3px 6px); background-size: 8.5px 100%; animation: fk-chev .5s linear infinite; }

.fk-budget .bar { display: flex; gap: 2px; height: 10px; }
.fk-budget .sg { position: relative; background: rgba(148, 163, 184, .12); border-radius: 3px; overflow: hidden; transition: opacity .3s; }
.fk-budget .sg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--c); box-shadow: 0 0 8px var(--c); transition: width .25s linear; }
.fk-budget .sg.over i { background: #F43F5E; box-shadow: 0 0 8px #F43F5E; }

.fk-budget .lg { display: flex; gap: 2px; margin-top: 4px; }
.fk-budget .lg span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #94A3B8; font-size: 9.5px; transition: opacity .3s; }
.fk-budget .lg small { display: block; font: 9px ui-monospace, Menlo, monospace; color: #64748B; }
.fk-presenting .fk-budget { opacity: 0; }

/* Player */
.fk-player { display: flex; flex-direction: column; gap: 10px; width: min(100%, 1280px); font-size: 13px; color: #CBD5E1; }
.fk-player button { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 7px; border: 1px solid #334155; background: #111C31; color: #CBD5E1; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; }
.fk-player button:hover { background: #18253F; }
.fk-player button.on { border-color: #38BDF8; color: #F1F5F9; background: #0E2A47; }
.fk-player .sp { flex: 1; }
/* Scene picker: a labelled box of clearly clickable buttons */
.fk-chapters { display: flex; flex-direction: column; gap: 8px; border: 1px solid #2A3A55; border-radius: 12px; padding: 12px 14px 14px; background: rgba(15, 23, 42, .55); }

.fk-chhead span { font-size: 12px; color: #64748B; }
.fk-chhead { align-items: center; }
.fk-chhead button { align-self: center; padding: 5px 10px; }
.fk-chrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fk-chrow .lbl { width: 70px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #64748B; }
.fk-chrow button { background: #15233D; border-color: #3B4F6E; color: #E2E8F0; padding: 7px 13px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 2px 0 #0A1222; transition: transform .1s, border-color .1s, background .1s; }
.fk-chrow button:hover { border-color: #38BDF8; background: #1B2D4D; transform: translateY(-1px); }
.fk-chrow button:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.fk-chrow button.on { background: #0E3A5F; border-color: #38BDF8; color: #F1F5F9; box-shadow: 0 0 0 1px #38BDF8, 0 0 12px rgba(56, 189, 248, .25); }
.fk-div { width: 100%; border: 0; border-top: 1px solid #1E293B; margin: 4px 0; }
/* Control row: view toggles left, transport centred, speed right */
.fk-bar { display: grid !important; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
.fk-bar .side { display: flex; gap: 8px; align-items: center; }
.fk-bar .side.r { justify-content: flex-end; }
.fk-bar .mid { display: flex; gap: 12px; align-items: center; }
.fk-bar .views button { border-radius: 0; }
.fk-bar .views button:first-child { border-radius: 7px 0 0 7px; }
.fk-bar .views button:last-child { border-radius: 0 7px 7px 0; }
@media (max-width: 980px) { .fk-bar { grid-template-columns: 1fr; justify-items: center; } .fk-bar .side.r { justify-content: center; } }
.fk-chapters em { font-style: normal; font: 600 11px ui-monospace, Menlo, monospace; color: #64748B; }
.fk-chapters button.on em { color: #7DD3FC; }

.fk-scrub { position: relative; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.fk-steps { position: absolute; left: 0; right: 0; top: 4px; height: 20px; }   /* step titles sit inside the timeline, above the time ruler */
.fk-steps > div { position: absolute; top: 0; height: 20px; box-sizing: border-box;
  font-size: 11px; color: #94A3B8; padding: 3px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fk-steps > div:hover { color: #E2E8F0; }

.fk-marks i { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(125, 211, 252, .35); pointer-events: none; }
.fk-head { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #38BDF8; box-shadow: 0 0 8px #38BDF8; pointer-events: none; }
.fk-head i { position: absolute; left: -5px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; background: #38BDF8; box-shadow: 0 0 10px #38BDF8;; pointer-events: auto; cursor: grab; transition: transform .12s; }
.fk-head i::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; }   /* bigger grab area than the dot itself */
.fk-head i:hover, .fk-scrub.grabbing .fk-head i { transform: scale(1.3); }
.fk-scrub.grabbing, .fk-scrub.grabbing .fk-head i { cursor: grabbing; }
.fk-tip { position: absolute; top: -26px; transform: translateX(-50%); background: #0F172A; border: 1px solid #334155; border-radius: 5px; padding: 2px 7px;
  font: 11px ui-monospace, Menlo, monospace; color: #E2E8F0; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 2; }
.fk-tip.on { opacity: 1; }
.fk-scrub:not(:hover) .fk-tip { opacity: 0; }

.fk-transport, .fk-options { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fk-transport .grp, .fk-options .grp { display: flex; gap: 2px; }
.fk-transport .grp button { padding: 6px 9px; border-radius: 0; }
.fk-transport .grp button:first-child { border-radius: 7px 0 0 7px; }
.fk-transport .grp button:last-child { border-radius: 0 7px 7px 0; }
.fk-transport .grp button.big { padding: 6px 16px; }
.fk-transport .speed button { font: 12px ui-monospace, Menlo, monospace; padding: 6px 8px; }
.fk-time { font: 600 15px ui-monospace, Menlo, monospace; color: #F1F5F9; display: flex; gap: 6px; align-items: baseline; }
.fk-time .dur { color: #64748B; font-weight: 400; font-size: 12px; }
.fk-options button { font-size: 12px; padding: 5px 10px; }
.fk-bar button { white-space: nowrap; }
.fk-player > .fk-time { align-self: center; margin-top: -4px; }   /* the timer, centred under the playback controls */
.fk-time[data-rate]::after { content: '· ' attr(data-rate); color: #FBBF24; font-size: 12px; }
/* Level of detail: faces of a detail sub-scene fade with --lod; flow lines run along the floor */
.fk-lod .fk-f { opacity: var(--lod, 0); }
.fk-lodflow .fk-f { background: repeating-linear-gradient(180deg, var(--pc) 0 30%, transparent 30% 100%); background-size: 100% 18px; animation: fkLodFlow 1.2s linear infinite; box-shadow: 0 0 8px var(--pc); }
@keyframes fkLodFlow { to { background-position: 0 18px; } }
.fk-label.lod { font-size: 11px; padding: 3px 8px; }
.fk-label.lod small { display: block; font-size: 10px; color: #94A3B8; font-weight: 400; }
.fk-label.lod.head { font-size: 12px; letter-spacing: .06em; border-color: rgba(255, 153, 0, .6); color: #FED7AA; }
.fk-label.lod .ic { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 2px; box-sizing: border-box; background: #fff; border-radius: 4px; flex: none; }
.fk-label.lod .ic svg { width: 100%; height: 100%; display: block; }
.fk-label.lod:has(.ics) { display: inline-grid; grid-template-columns: auto auto; column-gap: 7px; align-items: center; }
.fk-label.lod .ics { grid-row: span 2; display: flex; gap: 3px; }
/* Detail-view group headers (floor-lying, top-left of a group box) and logo tiles on top of boxes */
.fk-ghead { display: flex; align-items: center; gap: 8px; width: 100%; height: 100%; font: 700 19px/1.1 system-ui, sans-serif; color: #E2E8F0; white-space: nowrap; }
.fk-ghead .gi { flex: none; height: 100%; aspect-ratio: 1; display: grid; place-items: center; background: var(--gb); box-sizing: border-box; padding: 2px; border-radius: 3px; }
.fk-ghead .gi svg { width: 100%; height: 100%; display: block; }
.fk-ghead .gt small { display: block; font: 400 .684em system-ui, sans-serif; color: #94A3B8; margin-top: 2px; }
.fk-itop { width: 100%; height: 100%; box-sizing: border-box; padding: 3px; border-radius: 3px; display: grid; place-items: center; }
.fk-itop svg { width: 100%; height: 100%; display: block; }
/* Detail views: the HUD panels fade with the zoom (--hud, set per frame; a filter so it composes with the caption's own timeline opacity) */
.fk-legend, .fk-caption, .fk-trace, .fk-budget { opacity: var(--hud, 1); }
.fk-detailing .fk-legend, .fk-detailing .fk-caption, .fk-detailing .fk-trace, .fk-detailing .fk-budget { pointer-events: none; }
.fk-ftag { width: 100%; height: 100%; display: flex; align-items: flex-start; font-weight: 700; line-height: 1.15; color: #E2E8F0; }
.fk-ftag small { display: block; font-size: .78em; font-weight: 400; color: #94A3B8; margin-top: 2px; }
.fk-ftag .ics { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 6px; }
.fk-ftag .ic { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; padding: 2px; box-sizing: border-box; background: #fff; border-radius: 3px; }
.fk-ftag .ic svg { width: 100%; height: 100%; display: block; }
.fk-deploy[hidden] { display: none; }
.fk-chrow.fk-dgrid { display: grid; gap: 8px; justify-content: start; max-width: 100%; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #334155 transparent;
  padding: 4px 4px 6px; margin: -4px -4px 0; }   /* a narrow window scrolls the grid, not the page; the padding leaves room for the hover lift and outline */
.fk-dgrid .lbl { width: auto; padding-right: 10px; }
/* Hide overlays: the layer key, caption, latency card, trace and every floating label (checklists and floor text stay) */
.no-overlays .fk-legend, .no-overlays .fk-caption, .no-overlays .fk-budget, .no-overlays .fk-trace, .no-overlays .fk-label { display: none !important; }

/* Start screen (Player.showIntro): translucent sheet over the scene, in stage pixels (1280×720) */
.fk-intro { position: absolute; inset: 0; z-index: 30; pointer-events: auto; cursor: default; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 90px; padding: 0 30px;
  background: rgba(4, 8, 17, .74); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.fk-intro { align-content: center; row-gap: 14px; }
.fk-intro .lead { grid-column: 1 / 3; grid-row: 1; justify-self: end; max-width: 760px; text-align: left; }   /* a scene's opening paragraph, above the mouse and Enter */
.fk-intro:has(.lead) .l, .fk-intro:has(.lead) .m { grid-row: 2; }
.fk-intro:has(.lead) .r { grid-column: 3; grid-row: 1 / span 2; }
.fk-intro .lead b.t { display: block; margin-bottom: 8px; font: 700 13px system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #7DD3FC; }
.fk-intro .lead p { margin: 0; font: 400 16px/1.5 system-ui, sans-serif; color: #CBD5E1; }
.fk-intro .lead p b { color: #F1F5F9; font-weight: 600; }
.fk-intro .l { justify-self: end; opacity: .85; }
/* a title across the top, with a rule under it (the scene sets introTitle) */
.fk-intro .ttl { grid-column: 1 / -1; grid-row: 1; align-self: end; padding-bottom: 12px; border-bottom: 1px solid rgba(148, 163, 184, .35); }
.fk-intro .ttl h1 { margin: 0; font: 700 26px system-ui, sans-serif; letter-spacing: .01em; color: #F1F5F9; }
.fk-intro:has(.ttl) .lead { grid-row: 2; }
.fk-intro:has(.ttl) .l, .fk-intro:has(.ttl) .m { grid-row: 3; }
.fk-intro:has(.ttl) .r { grid-row: 2 / span 2; }
/* the opening paragraph in an inviting box */
.fk-intro .lead { background: rgba(14, 42, 71, .6); border: 1px solid rgba(56, 189, 248, .35); border-left: 4px solid #38BDF8; border-radius: 10px; padding: 16px 22px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.fk-intro .lead p { color: #E2E8F0; }
/* the mouse: smaller and quieter */
.fk-intro .l { opacity: .5; }
.fk-intro .l svg.ms { width: 290px; height: 218px; }
/* the controls overview: a little smaller */

/* the feature tour is the main button; Enter is there for anyone who has seen it */
.fk-intro .m .lbl { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 19px; color: #FDE68A; }

.fk-intro .m .ent { margin-top: 8px; font: 600 14px system-ui, sans-serif; padding: 8px 16px; border-radius: 20px; border: 1px solid #38BDF8; background: rgba(14, 58, 95, .55); color: #E0F2FE; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.fk-intro .m .ent:hover { background: rgba(14, 58, 95, .85); }
.fk-intro .m .ent kbd { font: 600 10.5px ui-monospace, Menlo, monospace; padding: 1px 6px; border-radius: 4px; border: 1px solid #475569; color: #94A3B8; }
.fk-intro .ms .t { font: 700 20px system-ui, sans-serif; }
.fk-intro .ms .s { font: 400 13px system-ui, sans-serif; fill: #94A3B8; }
.fk-intro .m { display: flex; flex-direction: column; align-items: center; gap: 16px; font-size: 20px; font-weight: 600; color: #CBD5E1; letter-spacing: .04em; }
.fk-intro .go { width: 160px; height: 160px; border-radius: 50%; border: 3px solid #38BDF8; background: rgba(14, 58, 95, .65); color: #E0F2FE; cursor: pointer; display: grid; place-items: center;
  box-shadow: 0 0 0 8px rgba(56, 189, 248, .12), 0 0 40px rgba(56, 189, 248, .35); transition: transform .15s, box-shadow .15s; }
.fk-intro .go svg { margin-left: 8px; }
.fk-intro .go:hover { transform: scale(1.06); box-shadow: 0 0 0 10px rgba(56, 189, 248, .18), 0 0 60px rgba(56, 189, 248, .5); }
.fk-intro .r { justify-self: start; width: 380px; opacity: .85; }
.fk-intro .r h4 { margin: 26px 0 6px; font: 700 13px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #7DD3FC; }

.fk-intro .r p { margin: 5px 0 0; font-size: 12.5px; line-height: 1.4; color: #94A3B8; }
.fk-intro-on .fk-free { display: none; }
.fk-intro-on .fk-global .cards, .fk-intro-on .fk-global .x { display: none; }
/* start screen: miniature controls */
.fk-intro .mk { font: 10px system-ui, sans-serif; color: #CBD5E1; }
.fk-intro .mk i { font-style: normal; }

<body>
<div class="wrap">
  <div id="fk"></div>
  <div id="controls"></div>
</div>
<script>
/*
 * FlowKit: a small kit for 3D architecture animations (CSS 3D transforms, no dependencies).
 *
 * Coordinates: x right, y down (floor at y = 0, "up" is negative y), z towards the viewer.
 *
 * Time model: a Timeline is a set of tracks. Every track is a pure function of time, so the
 * scene can be scrubbed forwards and backwards, played in reverse or in slow motion and always
 * shows exactly the same frame for the same time. Nothing is fire-and-forget.
 *   tl.add(target, {prop: to | [from, to] | [k0, k1, k2...], duration, ease, delay}, pos)  continuous tween
 *   tl.set(target, key, pos, value, apply, init)                                             step value
 *   tl.mark(pos, step, text)                                                                 scrubber marker
 * Every timed helper takes (tl, pos, ...) and returns the time it finishes, so scripts chain:
 *   let t = 0; t = packet.travel(tl, t, route, 1200); t = stage.checklist(tl, t, {...});
 */
(function (global) {
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- easing ---------- */
  const EASES = {
    linear: k => k,
    inQuad: k => k * k,
    outQuad: k => 1 - (1 - k) * (1 - k),
    inOutQuad: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2,
    inCubic: k => k * k * k,
    outCubic: k => 1 - Math.pow(1 - k, 3),
    inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
    inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
    outSine: k => Math.sin(k * Math.PI / 2)
  };
  const easeCache = {};
  function ease(name = 'outQuad') {
    if (typeof name === 'function') return name;
    if (EASES[name]) return EASES[name];
    if (easeCache[name]) return easeCache[name];
    const m = /^(in|out|inOut)Back(?:\(([\d.]+)\))?$/.exec(name);
    if (m) {
      const c1 = m[2] ? +m[2] : 1.70158, c3 = c1 + 1, c2 = c1 * 1.525;
      const f = m[1] === 'in' ? k => c3 * k * k * k - c1 * k * k
        : m[1] === 'out' ? k => 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2)
          : k => k < .5 ? (Math.pow(2 * k, 2) * ((c2 + 1) * 2 * k - c2)) / 2 : (Math.pow(2 * k - 2, 2) * ((c2 + 1) * (k * 2 - 2) + c2) + 2) / 2;
      return (easeCache[name] = f);
    }
    return EASES.outQuad;
  }
  // Time fraction at which an ease first reaches y (for monotonic eases)
  function invEase(f, y) {
    if (y <= 0) return 0; if (y >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 28; i++) { const m = (lo + hi) / 2; if (f(m) < y) lo = m; else hi = m; }
    return hi;
  }

  /* ---------- DOM + geometry primitives ---------- */
  function el(tag, cls, parent, html) {
    const e = document.createElement(tag || 'div');
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function g(parent, x = 0, y = 0, z = 0, extra = '') {
    const n = el('div', 'fk-n', parent);
    n.style.transform = `translate3d(${x}px,${y}px,${z}px) ${extra}`;
    return n;
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)))));
    return `rgb(${c.join(',')})`;
  }
  const rgbaOf = hex => { const n = parseInt(hex.slice(1), 16); return a => `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  // Box centred at (x,y,z); "front" faces +z.
  function box(parent, { x = 0, y = 0, z = 0, w, h, d, c = '#1E293B', faces = 'front,back,left,right,top', cls = '', bg = {} }) {
    const b = el('div', 'fk-n ' + cls, parent);
    b.style.transform = `translate3d(${x}px,${y}px,${z}px)`;
    const defs = {
      front: [w, h, `translateZ(${d / 2}px)`, c],
      back: [w, h, `rotateY(180deg) translateZ(${d / 2}px)`, shade(c, -0.25)],
      right: [d, h, `rotateY(90deg) translateZ(${w / 2}px)`, shade(c, -0.18)],
      left: [d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, shade(c, -0.08)],
      top: [w, d, `rotateX(90deg) translateZ(${h / 2}px)`, shade(c, 0.12)],
      bottom: [w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, shade(c, -0.4)]
    };
    const out = { el: b };
    for (const k of faces.split(',')) {
      const [fw, fh, t, col] = defs[k];
      const f = el('div', 'fk-f f-' + k, b);
      f.style.cssText += `width:${fw}px;height:${fh}px;left:${-fw / 2}px;top:${-fh / 2}px;transform:${t};background:${bg[k] || col};`;
      out[k] = f;
    }
    return out;
  }
  function plane(parent, { w, h, t = '', bg = 'transparent', cls = '', two = false, html }) {
    const f = el('div', 'fk-f ' + cls + (two ? ' two' : ''), parent, html);
    f.style.cssText += `width:${w}px;height:${h}px;left:${-w / 2}px;top:${-h / 2}px;transform:${t};background:${bg};`;
    return f;
  }
  // Transform that stretches a z-aligned element of length L0 between points a and b
  function orient(a, b, L0 = 100) {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    const L = Math.hypot(dx, dy, dz) || 0.001;
    const yaw = Math.atan2(dx, dz) / D2R, pitch = -Math.asin(dy / L) / D2R;
    return `translate3d(${(a[0] + b[0]) / 2}px,${(a[1] + b[1]) / 2}px,${(a[2] + b[2]) / 2}px) rotateY(${yaw}deg) rotateX(${pitch}deg) scale3d(1,1,${L / L0})`;
  }
  const lerp3 = (a, b, k) => [0, 1, 2].map(j => a[j] + (b[j] - a[j]) * k);
  const dist3 = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  function pathFn(pts) {
    const segs = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) { const len = dist3(pts[i], pts[i + 1]); segs.push({ a: pts[i], b: pts[i + 1], len, start: total }); total += len; }
    return {
      total, segs,
      at(t) {
        const s = Math.max(0, Math.min(1, t)) * total;
        let i = segs.findIndex(q => s <= q.start + q.len); if (i < 0) i = segs.length - 1;
        const q = segs[i]; return { p: lerp3(q.a, q.b, q.len ? (s - q.start) / q.len : 0), i };
      }
    };
  }
  // Points along a raised arc from a to b (DNS lookups, tokens)
  function arc(a, b, h = -200, n = 18) {
    return Array.from({ length: n + 1 }, (_, i) => { const k = i / n, p = lerp3(a, b, k); p[1] += h * Math.sin(Math.PI * k); return p; });
  }

  /* ---------- element transform state (for tweens on DOM elements) ---------- */
  const TS = new WeakMap();
  const TDEF = { x: 0, y: 0, z: 0, rotateX: 0, rotateY: 0, rotateZ: 0, scale: 1, opacity: 1 };
  const tstate = e => { let s = TS.get(e); if (!s) TS.set(e, s = { ...TDEF }); return s; };
  function writeProp(e, p, v) {
    const s = tstate(e); s[p] = v;
    if (p === 'opacity') { e.style.opacity = v; return; }
    e.style.transform = `translate3d(${s.x}px,${s.y}px,${s.z}px) rotateX(${s.rotateX}deg) rotateY(${s.rotateY}deg) rotateZ(${s.rotateZ}deg) scale3d(${s.scale},${s.scale},${s.scale})`;
  }
  function clearProps(e) { TS.delete(e); e.style.transform = ''; e.style.opacity = ''; }

  /* ---------- Timeline: deterministic, seekable in both directions ---------- */
  class Timeline {
    constructor(stage) {
      this.stage = stage; this.map = new Map(); this.tracks = []; this.calls = []; this.markers = [];
      this.owned = []; this.els = new Set(); this.duration = 0; this.last = -1; this.ci = 0; this.frozen = false; this.freezers = [];
    }
    track(target, key, apply, init) {
      let m = this.map.get(target); if (!m) this.map.set(target, m = new Map());
      let tr = m.get(key);
      if (!tr) { tr = { segs: [], apply, init, hasInit: arguments.length > 3, sig: undefined }; m.set(key, tr); this.tracks.push(tr); }
      return tr;
    }
    // Low-level: a segment on a track. val(k) gets linear progress k in [0,1] (already eased if ez given).
    seg(tr, start, dur, ez, val) {
      const E = ease(ez);
      tr.segs.push({ start, dur: Math.max(0, dur), val: E === EASES.linear ? val : k => val(E(k)), n: tr.segs.length });
      this.extend(start + dur); return start + dur;
    }
    // Custom continuous track (e.g. packet position): fn(k) returns a value, apply(value) draws it.
    fn(target, key, pos, dur, ez, val, apply) { return this.seg(this.track(target, key, apply), pos, dur, ez, val); }
    extend(t) { if (t > this.duration) this.duration = t; }
    wait(pos, dur = 0) { this.extend(pos + dur); return pos + dur; }
    add(targets, params = {}, pos = 0) {
      const { duration = 500, ease: ez = 'outQuad', delay = 0, ...props } = params;
      const list = targets == null ? [] : Array.isArray(targets) ? targets : [targets];
      this.extend(pos + duration);
      list.forEach((tg, i) => {
        const start = pos + (typeof delay === 'function' ? delay(tg, i) : delay);
        const isEl = tg instanceof Element;
        if (isEl) this.els.add(tg);
        for (const p in props) {
          let v = props[p]; if (typeof v === 'function') v = v(tg, i);
          const tr = this.track(tg, p, isEl ? x => writeProp(tg, p, x) : x => { tg[p] = x; });
          const cur = tr.segs.length ? tr.last : (isEl ? tstate(tg)[p] : tg[p]);
          const kf = Array.isArray(v) ? (v.length === 1 ? [cur, v[0]] : v) : [cur, v];
          tr.last = kf[kf.length - 1];
          const E = ease(ez), n = kf.length - 1;
          this.seg(tr, start, duration, 'linear', k => { if (k >= 1) return kf[n]; const f = k * n, j = Math.floor(f); return kf[j] + (kf[j + 1] - kf[j]) * E(f - j); });
        }
      });
      return pos + duration;
    }
    // Step value: from pos on, the track holds value (until the next set). init is shown before the first set.
    set(target, key, pos, value, apply, init) {
      this.seg(this.track(target, key, apply, init), pos, 0, 'linear', () => value);
      return pos;
    }
    // Escape hatch: a callback that is replayed from a reset when scrubbing backwards. Prefer set().
    call(fn, pos) { this.calls.push({ pos, fn, n: this.calls.length }); this.extend(pos); return pos; }
    mark(pos, step, text) { this.markers.push({ pos, step, text }); return pos; }
    own(fn) { this.owned.push(fn); }
    onFreeze(fn) { this.freezers.push(fn); }
    // Insert `extra` ms of time at b: everything scheduled at or after b moves later (used to give captions reading time)
    dilate(b, extra) {
      for (const tr of this.tracks) for (const q of tr.segs) if (q.start >= b) q.start += extra;
      for (const c of this.calls) if (c.pos >= b) c.pos += extra;
      for (const m of this.markers) if (m.pos >= b) m.pos += extra;
      for (const arr of [this._caps, this._pres]) if (arr) for (const o of arr) if (o.pos >= b) o.pos += extra;
      this.duration += extra;
    }
    freeze() {
      this.freezers.splice(0).forEach(f => f(this));
      for (const tr of this.tracks) tr.segs.sort((a, b) => a.start - b.start || a.n - b.n);
      this.calls.sort((a, b) => a.pos - b.pos || a.n - b.n);
      this.markers.sort((a, b) => a.pos - b.pos);
      this.frozen = true;
    }
    render(t) {
      if (!this.frozen) this.freeze();
      if (t < this.last && this.calls.length) { this.stage.reset(); this.ci = 0; for (const tr of this.tracks) tr.sig = undefined; }
      while (this.ci < this.calls.length && this.calls[this.ci].pos <= t) this.calls[this.ci++].fn();

  // Caption: a card near the top of the stage; each new step crossfades in and stays until the next one.
  // While a deployment view is open (stage.present) it moves up into a compact banner so it never covers the view.
  class Caption {
    constructor(stage) {
      this.stage = stage;
      this.el = el('div', 'fk-caption', stage.hud, '<div class="st"></div><div class="tx"></div>');
      this.st = this.el.querySelector('.st'); this.tx = this.el.querySelector('.tx');
      this.readBase = 1500; this.readPerChar = 45;   // reading time: ms to notice + ms per character
      this.CY = 150; this.TY = 12; this.DS = .8;    // normal y, y and scale while a deployment view is open

    }
    // Captions can be overridden from a config (window.FK_CAPTIONS[chapter title][original step]): { step, text, hold }
    at(tl, pos, step, text, { pop } = {}) {
      const ov = ((global.FK_CAPTIONS || {})[this.chapter] || {})[step] || {};
      const shown = ov.step ?? step, body = ov.text ?? text;
      tl.mark(pos, shown, body); tl.set(this, 'cap', pos, { step: shown, text: body }, v => this.show(v), null);
      if (!tl._caps) { tl._caps = []; tl.onFreeze(t2 => { this._readingTime(t2); this._layout(t2); }); }
      tl._caps.push({ pos, len: body.length, pop, hold: ov.hold });

    }
    // Give every caption time to be read (about 22 characters a second plus a moment to notice it): if the next
    // caption would replace it sooner, hold the whole timeline just before the next one

    _readingTime(tl) {

    // The card only moves to make room for a deployment view (stage.present), and moves back afterwards.
    _layout(tl) {

  /* ---------- Devices ---------- */

      stage.onFrame.push(() => { this.g.style.transform = `translate3d(${this.p[0]}px,${this.p[1]}px,${this.p[2]}px)`; });
      stage.onReset(() => { this._vis(false); this.setState({ s: 'tls', text: '', sub: '' }); });

    }
    _vis(v) { this.visible = v; this.g.style.display = v ? '' : 'none'; this.chip.el.style.display = v ? '' : 'none'; }
    setState({ s, text, sub }) {
      const c = COLORS[s] || s;

  }

  /* ---------- Drill: a node "slides out" into its deployment view; a token walks its internal stages ---------- */
  // o: { at, dx, dy, w, title, sub, frame, lanes: [{ label | box, h, stages: [{label, sub, items}] }], panel: {lane, x, w} }
  // Stage and check states are tracks, so runs can be replayed, scrubbed and reversed like everything else.
  class Drill {
    constructor(stage, o) {
      this.stage = stage; this.o = o;
      const SW = o.sw || 148, GAP = o.gap || 20, PAD = 18, W = o.w;
      const parts = []; this.lanes = [];
      let y = 66;
      o.lanes.forEach((ln, li) => {
        const h = ln.h || 120;
        if (ln.box) { parts.push(`<div class="box" style="left:${PAD - 9}px;top:${y}px;width:${W - 2 * PAD + 18}px;height:${h + 40}px"><span>${ln.box}</span></div>`); y += 30; }
        else if (ln.label) { parts.push(`<div class="lnl" style="left:${PAD}px;top:${y}px">${ln.label}</div>`); y += 18; }
        const top = y, xs = ln.stages.map((_, i) => PAD + i * (SW + GAP));
        ln.stages.forEach((st, i) => {
          if (i) parts.push(`<i class="ar" style="left:${xs[i] - GAP}px;top:${top + 22}px;width:${GAP}px"></i>`);
          parts.push(`<div class="st" data-l="${li}" style="left:${xs[i]}px;top:${top}px;width:${SW}px;height:${h}px"><div class="nm">${st.label}</div><div class="sb">${st.sub || ''}</div>` +
            (st.items || []).map(x => `<div class="ck"><b></b><span>${x}</span></div>`).join('') + `<div class="note"></div></div>`);
        });
        this.lanes.push({ top, h, xs, rowY: top + 22 });
        y = top + h + (ln.box ? 22 : 28);

      const H = y;
      if (o.panel) {
        const first = this.lanes[0], last = this.lanes[this.lanes.length - 1], ln = this.lanes[o.panel.lane ?? 0];
        const top = o.panel.full ? first.top : ln.top, h = o.panel.full ? last.top + last.h - first.top : ln.h;
        parts.push(`<div class="pl" style="left:${o.panel.x}px;top:${top}px;width:${o.panel.w}px;height:${h}px"></div>`);
      }
      Object.assign(this, { SW, W, H });
      const dx = o.dx ?? 60, dy = o.dy ?? -(H + 60);
      const html = `<div class="fk-dwrap" style="transform:translate(${dx}px,${dy}px)">
          <svg class="lead" width="${Math.abs(dx) + 10}" height="${Math.abs(dy) + 10}" style="left:${-dx}px;top:${H}px;position:absolute;overflow:visible"><line x1="0" y1="${-dy - H}" x2="${dx}" y2="0" /></svg>
          <div class="fk-drill" style="width:${W}px;height:${H}px">
            <div class="dh"><b>${o.title}</b><span>${o.sub || ''}</span></div><div class="fr">${o.frame || ''}</div>
            ${parts.join('')}<div class="tok"></div>
          </div></div>`;
      this.bb = stage.billboard(null, html, { screen: true, p: o.at });
      const q = sel => [...this.bb.el.querySelectorAll(sel)];
      this.card = q('.fk-drill')[0]; this.lead = q('.lead')[0]; this.tok = q('.tok')[0]; this.pl = q('.pl')[0];
      const sts = q('.st'); let n = 0;
      this.st = this.lanes.map(ln => ln.xs.map(() => sts[n++]));
      this._vis(false);
      stage.onReset(() => { this._vis(false); sts.forEach(e => { e.className = 'st'; e.querySelector('.note').textContent = ''; }); q('.ck').forEach(e => { e.className = 'ck'; }); this.tok.className = 'tok'; if (this.pl) this.pl.innerHTML = ''; });
    }
    _vis(v) { this.bb.el.style.display = v ? '' : 'none'; }
    pos([l, i]) { const ln = this.lanes[l]; return [ln.xs[i] + this.SW / 2, ln.rowY]; }
    stState(tl, pos, li, v, note = '') { const e = this.st[li[0]][li[1]]; tl.set(e, 'st', pos, [v, note], ([x, nt]) => { e.className = 'st' + (x ? ' ' + x : ''); e.querySelector('.note').textContent = nt; }, ['', '']); return pos; }
    ckState(tl, pos, e, v) { tl.set(e, 'ck', pos, v, x => { e.className = 'ck' + (x ? ' on ' + x : ''); }, ''); return pos; }
    tokState(tl, pos, v) { tl.set(this.tok, 'cls', pos, v, x => { this.tok.className = 'tok' + (x ? ' ' + x : ''); }, ''); return pos; }
    panel(tl, pos, html) { if (this.pl) tl.set(this.pl, 'html', pos, html, x => { this.pl.innerHTML = x; }, ''); return pos; }
    clear(tl, pos) {
      this.st.flat().forEach((e, k) => { tl.set(e, 'st', pos, ['', ''], ([x, nt]) => { e.className = 'st' + (x ? ' ' + x : ''); e.querySelector('.note').textContent = nt; }, ['', '']); e.querySelectorAll('.ck').forEach(c => this.ckState(tl, pos, c, '')); });

    moveTo(tl, pos, xy, dur = 450) { tl.add(this.tok, { x: xy[0], y: xy[1], duration: dur, ease: 'inOutSine' }, pos); return pos + dur; }
    move(tl, pos, li, dur) { return this.moveTo(tl, pos, this.pos(li), dur); }
    open(tl, pos, dur = 700) {
      tl.set(this, 'vis', pos, true, v => this._vis(v), false);
      tl.add(this.card, { scale: [.04, 1], opacity: [0, 1], duration: dur, ease: 'outBack(1.2)' }, pos);
      tl.add(this.lead, { opacity: [0, 1], duration: dur, ease: 'linear' }, pos);
      tl.add(this.tok, { x: [-24, -24], y: [this.lanes[0].rowY, this.lanes[0].rowY], opacity: [0, 0], duration: 0 }, pos);
      return pos + dur;
    }
    enter(tl, pos) {
      tl.add(this.tok, { x: [-24, -24], y: [this.lanes[0].rowY, this.lanes[0].rowY], duration: 0 }, pos);

    }
    // Visit a stage: move there, light it, tick each check with its status ('pass' | 'fail' | 'skip'), then settle
    visit(tl, pos, li, { st, verdict, tick = 420, hold = 450, keep = false, note = '' } = {}) {

      tl.set(this, 'vis', pos + dur, false, v => this._vis(v), false);
      return pos + dur;
    }
  }

  /* ---------- Dot: a small glowing token with a fading tail, for subtle flows (e.g. DNS lookups) ---------- */
  class Dot {
    constructor(stage, parent, { color = '#E2E8F0', size = 11, tail = 5, lag = .018 } = {}) {
      this.p = [0, 0, 0]; this.path = null; this.k = 0; this.visible = false;
      const mk = (sz, op) => stage.billboard(parent, `<div class="fk-dot" style="--c:${color};width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px;opacity:${op}"></div>`, { p: [0, 0, 0] });
      this.head = mk(size, 1); this.head.p = () => this.p;
      this.tail = Array.from({ length: tail }, (_, i) => {
        const b = mk(size * (1 - (i + 1) / (tail + 1.5)), .55 * (1 - i / tail));
        b.p = () => this.path ? this.path.at(Math.max(0, this.k - lag * (i + 1))).p : this.p;
        return b;
      });
      this._vis(false); stage.onReset(() => this._vis(false));
    }
    _vis(v) { this.visible = v; [this.head, ...this.tail].forEach(b => { b.el.style.display = v ? '' : 'none'; }); }
    show(tl, pos, v) { tl.set(this, 'vis', pos, v, x => this._vis(x), false); return pos; }
    travel(tl, pos, pts, dur, ez = 'inOutSine') {
      const path = pathFn(pts), E = ease(ez);
      tl.fn(this, 'pos', pos, dur, 'linear', k => [path, E(k)], ([pa, kk]) => { this.path = pa; this.k = kk; this.p = pa.at(kk).p; });
      return pos + dur;
    }
  }

  /* ---------- Effects ---------- */
  function ring(stage, parent, tl, pos, p, color = '#38BDF8', size = 140) {
    const b = stage.billboard(parent, `<div style="width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;border:3px solid ${color};box-shadow:0 0 16px ${color}"></div>`, { p });
    b.el.style.display = 'none'; tl.own(() => stage.removeBillboard(b));
    const vis = v => { b.el.style.display = v ? '' : 'none'; };
    tl.set(b, 'vis', pos, true, vis, false); tl.set(b, 'vis', pos + 900, false);
    tl.add(b.el.firstChild, { scale: [.15, 1.6], opacity: [1, 0], duration: 900, ease: 'outQuad' }, pos);
    return pos;
  }
  // Small token flying from a to b (spans to the obs wall, cookies, bot swarms...)
  function fly(stage, parent, tl, pos, a, b, { color = '#A78BFA', dur = 900, size = 10, arc: h = -200, html, ease: ez = 'inOutSine' } = {}) {
    const o = { t: 0 };
    const d = stage.billboard(parent, html || `<div style="width:${size}px;height:${size}px;margin:${-size / 2}px 0 0 ${-size / 2}px;border-radius:50%;background:${color};box-shadow:0 0 10px 2px ${color}"></div>`,
      { p: () => { const p = lerp3(a, b, o.t); p[1] += h * Math.sin(Math.PI * o.t); return p; } });
    d.el.style.display = 'none'; tl.own(() => stage.removeBillboard(d));
    const vis = v => { d.el.style.display = v ? '' : 'none'; };
    tl.set(d, 'vis', pos, true, vis, false); tl.set(d, 'vis', pos + dur, false);
    tl.add(o, { t: [0, 1], duration: dur, ease: ez }, pos);
    return pos + dur;
  }

  /* ---------- Detail: level of detail for a device ---------- */
  // When you take the camera (zoom, orbit, pan) and close in on a device, the device sinks away and a detailed
  // sub-scene grows in its place. It follows the camera only, never the timeline, so scripted playback is unchanged.
  //   new Detail(stage, device, ({ g, box, label, outline, flow }) => { ...build in world coordinates... }, { near, far, at })
  // near / far: camera distance (zoom distance plus how far the view centre is from the device) where the detail is
  // fully shown / starts to appear.
  const d0 = d => d.g.style.display !== 'none';
  class Detail {
    constructor(stage, dev, build, { near = 1300, far = 2300, at, hide = [], links = [], tags = [], walls = [], card, zone, title = '', shot, atlasLinks = true } = {}) {
      // atlasLinks: in the Full architecture view, join this diagram to the next one along with lane connectors
      // hide: other devices the detail replaces; links: cables whose job the detail's own flow lines take over
      // title, shot: how it is listed under "Deployment diagrams" in the player, and the camera that opens it
      Object.assign(this, { stage, dev, near, far, hide, links, tags, walls, title, atlasLinks, ax: 0, f: 0, c: at || [dev.x, 0, dev.z], labels: [] });   // ax: x offset in the Full architecture view   // walls: firewalls the wider view spills across   // tags: overlay labels of what it replaces
      this.shot = shot || { x: this.c[0], y: -60, z: this.c[2], rx: -55, ry: 0, d: near * .95 };
      // zone: the layer tile [x1, z1, x2, z2] the cursor must be over for this detail to open (defaults to the card's tile)
      this.zone = zone || (card && card.from) || [this.c[0] - 350, this.c[2] - 350, this.c[0] + 350, this.c[2] + 350];
      this.g = g(stage.world, 0, 0, 0); this.g.classList.add('fk-lod', 'fk-dg'); this.g.style.display = 'none';   // fk-dg: a diagram's contents
      // card: the layer tile lifts out of the floor and grows to the detail's footprint, the detail sitting on top of it.
      //   { from: [x1, z1, x2, z2] the tile it starts as, to: [x1, z1, x2, z2] its full size, lift, color }
      if (card) {
        const [x1, z1, x2, z2] = card.to, w = x2 - x1, d = z2 - z1, t = 16, col = card.color || '#22D3EE', rgba = rgbaOf(col);
        this.card = { ...card, lift: card.lift ?? 45, w, d };
        this.cardShadow = el('div', 'fk-n fk-lod', stage.world); this.cardShadow.style.display = 'none';
        plane(this.cardShadow, { w: w + 80, h: d + 80, t: 'translateY(-1px) rotateX(90deg)', bg: 'radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,.25) 70%, transparent)' });
        this.cardG = el('div', 'fk-n fk-lod', stage.world); this.cardG.style.display = 'none';
        const slab = box(this.cardG, { y: t / 2, w, h: t, d, c: '#0B1626' });
        slab.top.classList.add('fk-slab-top'); this.cardG.style.setProperty('--cc', col);
        slab.top.style.background = `linear-gradient(180deg, ${rgba(.10)}, ${rgba(.04)}), #0A1422`;
        slab.top.style.boxShadow = `inset 0 0 0 3px ${rgba(.75)}, 0 0 40px ${rgba(.35)}`;
        for (const k of ['front', 'back', 'left', 'right']) slab[k].style.boxShadow = `inset 0 3px 0 ${rgba(.6)}`;
      }
      const G = this.g, CB = this.card && this.card.to, out = p => !!CB && (p[0] < CB[0] - 4 || p[0] > CB[2] + 4 || p[2] < CB[1] - 4 || p[2] > CB[3] + 4);   // outside its own card
      const outTag = (o, n) => { if (out([o.x, 0, o.z])) n.classList.add('xo'); return n; };
      build({
        g: G,
        box: o => box(G, o),
        outline: o => outline(stage, G, o),
        label: (p, html, cls = '') => { const b = stage.billboard(null, `<div class="fk-label lod ${cls}">${html}</div>`, { screen: true, p }); b.el.style.display = 'none'; this.labels.push(b); return b; },
        // an animated flow line along the floor (or at height y) from a to b
        flow: (a, b, color = '#22D3EE', w = 6) => { const n = el('div', 'fk-n fk-lodflow' + (out(a) || out(b) ? ' xo' : ''), G); n.style.transform = orient(a, b); n.style.setProperty('--pc', color); plane(n, { w, h: 100, t: 'rotateX(90deg)', two: true, bg: '' }); return n; },
        // a dashed group box with its header (icon square + title) lying on the floor in the top-left (back-left)
        // corner, the usual convention for AWS deployment diagrams. icon: SVG markup; iconBg: tile colour behind it
        group: ({ x1, z1, x2, z2, color, icon, iconBg = 'transparent', title = '', sub = '', hw = 260, hh = 44, width = 4, dash = '12 8', fill = .03, font = 19 }) => {   // font: header title px (sub scales with it)
          outline(stage, G, { pts: [[x1, z1], [x2, z1], [x2, z2], [x1, z2]], color, width, dash, fill });
          const pad = Math.round(font * .32);   // a little room between the header and the dashed edge
          plane(G, { w: hw, h: hh, t: `translate3d(${x1 + pad + hw / 2}px,-3px,${z1 + pad + hh / 2}px) rotateX(90deg)`,
            html: `<div class="fk-ghead" style="--gc:${color};--gb:${iconBg};font-size:${font}px">${icon ? `<span class="gi">${icon}</span>` : ''}<span class="gt"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span></div>` });
        },
        // a flat label printed on the floor, centred on (x, z), like the text under an icon in a 2D diagram
        tag: ({ x, z, text, sub = '', w = 160, h = 40, size = 15, align = 'center', cable = false }) => outTag({ x, z }, plane(G, { w, h, t: `translate3d(${x}px,-2px,${z}px) rotateX(90deg)`,   // cable: it labels a traffic line (hidden in slide view)
          html: `<div class="fk-ftag${cable ? ' fl' : ''}" style="font-size:${size}px;text-align:${align};justify-content:${align === 'left' ? 'flex-start' : 'center'}"><div>${text}${sub ? `<small>${sub}</small>` : ''}</div></div>` })),
        // a logo tile lying on top of a 3D box (y: height of the box top, negative up)
        iconTop: ({ x, y, z, icon, size = 34, bg = '#fff' }) => plane(G, { w: size, h: size, t: `translate3d(${x}px,${y - 1}px,${z}px) rotateX(90deg)`, html: `<div class="fk-itop" style="background:${bg}">${icon}</div>` })
      });
      stage.details.push(this);
    }
    // Is floor point p over this detail? Once it is mostly open, its whole footprint counts, so the cursor can roam it
    contains(p) {
      const [x1, z1, x2, z2] = this.f > .3 && this.card ? this.card.to : this.zone;
      return p[0] >= x1 && p[0] <= x2 && p[2] >= z1 && p[2] <= z2;
    }
    update(cam, free) {
      const d = this.dev, [cx, , cz] = this.c, reach = cam.d + Math.hypot(cam.x - cx, cam.z - cz);
      const goal = this.stage.atlasOn ? 1 : free && d0(this.dev) ? (this.stage.plan && this.stage.plan.d === this ? 1 : clamp((this.far - reach) / (this.far - this.near), 0, 1)) : 0;   // Full architecture: every diagram open   // only for a device that is on stage; fully open in plan view
      const rate = this.stage.plan && this.stage.plan.d === this ? .12 : .06;   // opened from its button (straight to Top down): grow quickly; wheeling in: ease slowly
      this.f += (goal - this.f) * rate; if (Math.abs(goal - this.f) < .003) this.f = goal;

      const C = this.card, s = C ? 1 : .7 + .3 * f, lift = C ? C.lift * f : 0;
      this.g.style.transform = `translate3d(${cx + this.ax}px,${-lift}px,${cz}px) scale3d(${s},${s},${s}) translate3d(${-cx}px,0,${-cz}px)`;
      this.g.style.setProperty('--lod', f.toFixed(3));

  const ROLES = {

    t = toWorkload(tl, t);
    cap(tl, t, '2 · Step-up to a human', 'Over the amount limit and to a new beneficiary: the agent cannot approve its own payment. L4 asks the owner’s approver out of band (placeholder), who declines');
    t = stage.checklist(tl, t, { at: D.wlOn.top, title: 'Payments workload · fine-grained checks', items: [{ t: 'Mandate pay-50k · from the injected reference' },
      { t: 'Amount $2,000,000 > $50,000', s: 'fail' }, { t: 'Beneficiary not on the approved list', s: 'fail' }, { t: 'Step-up · owner’s approver, out of band', s: 'warn' }],
      result: 'Hold · ask a human', resultColor: '#FBBF24', step: 360, hold: 500, dx: 40, dy: 10 });
    cap(tl, t, '2 · The approver says no', 'A push reaches the owner’s approver on their phone; they decline');
    t = humanLoop(tl, t, 'pay', false, D.wlOn);
    t = stage.checklist(tl, t, { at: D.wlOn.top, title: 'Payments workload · step-up', items: [{ t: 'Approver declined', s: 'fail' }], result: '403 · approval declined', resultColor: '#F43F5E', step: 300, hold: 400, dx: 40, dy: 10 });
    obs.log(tl, t, `payments-svc      403  session=${AG.A.sid} step-up declined amount=2000000`, '#FDA4AF', { err: 1 });
    t = agentBack(tl, t, '403 Forbidden', 'approval declined', { l5: true });
    // 3 · a burst, then the behavior signal: revoke this session and its credential
    cap(tl, t, '3 · A burst', 'It retries in a burst of small payments, trying to stay under the limit');
    stage.shot(tl, t, look(D.cdnA, { dx: -400, dz: 250, ry: 14, dist: 2800 }), 1400);
    for (let i = 0; i < 14; i++) fly(stage, W, tl, t + 300 + i * 120, [X[0] + 60, Y - 20, C.aagent.z], [D.cdnA.x - 40, -120, D.cdnA.z], { color: '#FB923C', dur: 900, arc: -120, size: 8 });
    for (let i = 0; i < 5; i++) tele(tl, t + 1300 + i * 220, D.cdnA, '#FB923C');   // the edge reports the burst
    t += 2400;
    cap(tl, t, '3 · Revoke the session', `The signal manager in L6 sees two refusals and a burst on session ${AG.A.sid} and raises a CAEP signal. L4 revokes that session and its credential, and alerts the owner and the SOC. Other instances keep working`);
    t = agentSignal(tl, t, `CAEP · revoke ${AG.A.sid}`, `2 refusals, burst · ${AG.A.sid}`);
    t = stage.checklist(tl, t, { at: D.t2.top, title: 'L4 · signal receiver', items: [{ t: 'Security event token verified' }, { t: `Subject · session ${AG.A.sid}, key ${AG.A.jkt}` },
      { t: 'Revoke the session and its credential', s: 'warn' }, { t: 'Alert · owner (Treasury Ops) and SOC (placeholder)' }],
      result: 'Session revoked in seconds', resultColor: '#FBBF24', step: 380, hold: 800, dx: 40, dy: 10 });
    obs.log(tl, t, `signal-receiver   revoke session=${AG.A.sid} jkt=${AG.A.jkt.slice(1)} reason=behavior`, '#FDE68A', { err: 1 });
    cap(tl, t, '3 · Contained', 'Its next request is a small payment the mandate would normally allow. The session is revoked, so L4 refuses it without waiting for a token to expire, and asks for re-authentication');

    t = stage.checklist(tl, t, { at: D.t2.top, title: 'T2 gateway · agent checks', items: sessionChecks(AG.A, [], false),
      result: '401 · re-authentication required', resultColor: '#F43F5E', step: 360, hold: 700, dx: 40, dy: 10 });
    t = agentBack(tl, t, '401 Unauthorized', 'session revoked · re-authenticate');
    // 4 · the pattern repeats in another instance: suspend the registration
    cap(tl, t, '4 · The same pattern elsewhere', `A second instance, session ${AG.B.sid} with its own key, has read the same invoice and starts the same requests. It too is refused at L4`);
    t = agentIn(tl, t, 'GET /v1/accounts?all', `${AG.B.sid} · signed`, { edge: false });
    t = stage.checklist(tl, t, { at: D.t2.top, title: 'T2 gateway · agent checks', items: sessionChecks(AG.B, [{ t: 'Scope · accounts.read not granted', s: 'fail' }]),
      result: '403 · outside its scope', resultColor: '#F43F5E', step: 300, hold: 500, dx: 40, dy: 10 });
    t = agentBack(tl, t, '403 Forbidden', 'outside mandate');
    cap(tl, t, '4 · Suspend the registration', 'The same behavior across sessions of one registration means the problem is the agent, not one copy. The registration is suspended and every one of its sessions revoked');
    t = agentSignal(tl, t, 'CAEP · suspend treasury agent', 'same pattern · 2 sessions');
    t = stage.checklist(tl, t, { at: D.t2.top, title: 'L4 · signal receiver', items: [{ t: 'Pattern across 2 sessions of one registration', s: 'warn' }, { t: `Registration · ${AG.name} suspended`, s: 'fail' },

    cap(tl, t, '5 · Back with a human in the loop', 'After review, the owner’s approver re-authorizes the agent out of band. It comes back with a clean start: a new session, a new key and fresh context, the old keys stay revoked, and a reduced mandate until the review closes');
    cap(tl, t, '5 · The approver says yes', 'The owner’s approver reviews the trail on their phone and approves');

      result: 'Reinstated', step: 380, hold: 800, dx: 40, dy: 10 });
    t = agentIn(tl, t, 'POST /v1/payments', `$9,000 · ${AG.N.sid}`, { edge: false });
    t = stage.checklist(tl, t, { at: D.t2.top, title: 'T2 gateway · coarse-grained checks', items: sessionChecks(AG.N, [{ t: 'Registration · reinstated' }, { t: 'Scope · payments.create' }]),

    t = toWorkload(tl, t);
    t = stage.checklist(tl, t, { at: D.wlOn.top, title: 'Payments workload · fine-grained checks', items: [{ t: 'Mandate · reduced to ≤ $10,000' }, { t: 'Amount $9,000 ≤ $10,000' }, { t: 'Beneficiary on the approved list' }],
      result: 'Book the payment', step: 300, hold: 600, dx: 40, dy: 10 });
    pk.state_(tl, t, 'ok', '201 Created', 'under the reduced mandate');
    stage.shot(tl, t, SHOT.front, 1400);
    t = go(tl, t + 200, pk, [...AG.IN, L.t2On], 3800, { reverse: true, cls: 'ok', ease: 'inOutQuad' });

    t = pk.vanish(tl, t + 600) + 300;

    t = stage.shot(tl, t, SHOT.obs, 2200);
    tl.wait(t, 3500);
  }

  // The layers in detail: every layer explainer in one flow, in tour order (L1, L0, L2 to L6, then P). Each part reads

  const DETAIL = [['L1', 'L1 · Client'], ['L0', 'L0 · DNS Control Plane'], ['L2', 'L2 · Edge Protection / CDN'], ['L3', 'L3 · Regional Perimeter'],
    ['L4', 'L4 · Gateway Tier'], ['L5', 'L5 · IFA Workload Zone'], ['L6', 'L6 · Internal Network'], ['P', 'P · Private Connectivity']];
  function chLayersDetail(tl) {
    base(tl, '', 400);
    stage.flag(tl, 0, 'fk-notrace', true);
    let t = 300;
    for (const [k, name] of DETAIL) {
      const spec = LAYER_CH[k].spec;
      stage.caption.chapter = name;
      if (spec.legs) budget.begin(tl, t, spec.legs); else tl.set(budget, 'spend', t, null, v => budget.paint(v, [], null), null);   // no budget for this layer

          after(moved ? 800 : 0, () => { if (!hoverOnly) click(el); act(el); });
        });
        t += b[0];
      });
      after(t, () => finish('end'));
    };
    quit.onclick = () => finish(true);
    endCard.querySelector('.rp').onclick = e => { e.stopPropagation(); hideEnd(); start(); };
    ['pointerdown', 'wheel', 'keydown'].forEach(ev => addEventListener(ev, e => { if (!endCard.hidden && e.isTrusted && !endCard.contains(e.target)) { hideEnd(); showChoice(true); } }, { capture: true }));   // anything else: on to Start here
    return { start, get on() { return on; } };
  })();
  // the start screen: a title, and the feature tour as the main button (Enter is still there, for anyone who has seen it)
  player.introTitle = 'CIB Unified Ingress Architecture Explorer';
  { const si = player.showIntro.bind(player); player.showIntro = (...a) => { si(...a); const m = player.intro && player.intro.querySelector('.m'); if (!m) return;
      const go = m.querySelector('.go'); go.classList.add('tour'); go.title = 'Take the 35-second feature tour (start here)'; go.onclick = e => { e.stopPropagation(); ftour.start(); };
      const lbl = m.querySelector('span'); lbl.className = 'lbl'; lbl.innerHTML = 'Feature tour<small>35 seconds · start here</small>';
      const ent = document.createElement('button'); ent.className = 'ent'; ent.title = 'Go straight to the explorer'; ent.innerHTML = 'Enter the explorer <kbd>Enter</kbd>'; ent.onclick = e => { e.stopPropagation(); player.play(); };
      m.appendChild(ent); }; }
  window.FK_PLAYER = player; window.FK_GL = GL;
  const q = new URLSearchParams(location.search);
  const ch = Math.max(1, Math.min(chapters.length, +q.get('ch') || 1));
  player.load(ch - 1);
  // with a link to a moment (?t=) go straight there; otherwise the start screen over the finished first flow, ready to play
  if (q.has('t')) player.seek(+q.get('t'));
  else if (q.has('ch')) { player.seek(player.duration); player.showIntro(); }
  else { player.seek(player.duration); GL.world(); player.showIntro(); staged = true; (player.chBtns || []).forEach(b => b.classList.remove('on')); }   // no flow lit until one is picked   // the start: the start screen over the world map
})();

</script>
